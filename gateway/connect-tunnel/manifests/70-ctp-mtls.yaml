# Phase 3: mTLS — the "cert per device" half of the model. The listener now
# requires a client cert chaining to the tunnel client CA (default mode is
# require-and-verify), on top of the per-stream JWT. Together: the connection
# authenticates the device, each CONNECT stream authenticates the grant.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: tunnel-mtls
  namespace: connect-tunnel
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: tunnel-gw
  tls:
    clientValidation:
      caCertificateRefs:
      - kind: ConfigMap
        name: client-ca
        group: ""
