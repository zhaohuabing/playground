# HTTPS listener that acts as the tunnel entry point. No listener hostname on
# purpose: clients dial the proxy by IP/Service name, so SNI may be absent and
# the filter chain must be a catch-all. Tunnel targets are matched per-route
# from the CONNECT authority instead.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tunnel-gw
  namespace: connect-tunnel
spec:
  gatewayClassName: envoy-gateway
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - name: proxy-tls
    allowedRoutes:
      namespaces:
        from: Same
