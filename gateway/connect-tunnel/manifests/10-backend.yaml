# The tunnel target: a plain HTTP echo server. Reached only through the
# CONNECT tunnel; it echoes request details so we can see the bytes arrived
# unmodified.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: connect-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo
  template:
    metadata:
      labels:
        app: echo
    spec:
      containers:
      - name: echo
        image: registry.k8s.io/gateway-api/conformance/echo-basic:v0.1.0
        env:
        - name: HTTP_PORT
          value: "8080"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: connect-tunnel
spec:
  selector:
    app: echo
  ports:
  - port: 8080
    targetPort: 8080
